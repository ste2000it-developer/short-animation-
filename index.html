<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Ramakien Animation Studio</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#11131a;color:white;font:16px system-ui,sans-serif}
header{padding:14px 12px 7px;text-align:center}h1{font-size:19px;margin:0 0 4px}small{color:#aeb6c8}
.tabs{display:flex;gap:8px;padding:9px 12px;max-width:480px;margin:auto}.tabs button{flex:1;border:1px solid #555e72;border-radius:12px;background:#252b38;color:white;padding:12px 8px;font-weight:700;cursor:pointer}.tabs button.active{background:#f0a74c;color:#171717;border-color:#f0a74c}
.screen{margin:0 auto;width:min(calc(100vw - 20px),440px);aspect-ratio:9/16;border:1px solid #42485b;border-radius:12px;overflow:hidden;background:#202532}
iframe{display:block;border:0;width:100%;height:100%;background:#eee9e3}.placeholder{height:100%;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px}.placeholder p{color:#b9c1d1;line-height:1.6}.placeholder strong{font-size:22px}
.note{text-align:center;max-width:460px;margin:12px auto;padding:0 12px;color:#aeb6c8;font-size:13px;line-height:1.6}.note a{color:#f0a74c}
</style></head><body>
<header><h1>RAMAKIEN · Animation Studio</h1><small>TP01 / TP02</small></header>
<nav class="tabs"><button id="b1" onclick="show(1)">TP01 · ทรพา</button><button id="b2" onclick="show(2)">TP02 · นนทกาล</button></nav>
<main class="screen" id="screen"></main><p class="note" id="note"></p>
<script>
function show(n){
document.getElementById('b1').classList.toggle('active',n===1);
document.getElementById('b2').classList.toggle('active',n===2);
const screen=document.getElementById('screen'),note=document.getElementById('note');
if(n===1){screen.innerHTML='<iframe src="./TP01.html" title="TP01 ทรพา แอนิเมชันต้นฉบับ" loading="eager" allow="autoplay"></iframe>';note.innerHTML='กำลังแสดงไฟล์ TP01.html ต้นฉบับโดยตรง · <a href="./TP01.html" target="_blank" rel="noopener">เปิด TP01 เต็มหน้า</a>';}
else{screen.innerHTML='<iframe src="./TP02.html" title="TP02 นนทกาล พื้นที่ประกอบหุ่น" loading="eager"></iframe>';note.innerHTML='พื้นที่จัดโครงหุ่น TP02 · <a href="./TP02.html" target="_blank" rel="noopener">เปิด TP02 เต็มหน้า</a>';}
history.replaceState(null,'','#TP0'+n);
}
show(location.hash==='#TP02'?2:1);
</script></body></html>
