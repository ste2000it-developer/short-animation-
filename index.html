<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Ramakien Animation Studio</title><style>*{box-sizing:border-box}body{margin:0;background:#11131a;color:#fff;font:16px system-ui,sans-serif}header{padding:18px 16px 10px;text-align:center}h1{font-size:19px;margin:0 0 5px}small{color:#aeb6c8}.tabs{display:flex;gap:8px;padding:12px;max-width:480px;margin:auto}.tabs button{flex:1;border:1px solid #555e72;border-radius:12px;background:#252b38;color:#fff;padding:14px;font-weight:700}.tabs button.active{background:#f0a74c;color:#171717;border-color:#f0a74c}.screen{margin:auto;width:min(calc(100vw - 32px),360px);aspect-ratio:9/16;border:1px solid #42485b;border-radius:12px;display:flex;align-items:center;justify-content:center;text-align:center;padding:22px;background:#202532}.screen strong{display:block;font-size:23px;margin-bottom:12px}.screen p{line-height:1.65;color:#b9c1d1}.note{text-align:center;max-width:450px;margin:14px auto;padding:0 16px;color:#aeb6c8;font-size:13px}</style></head><body><header><h1>RAMAKIEN · Animation Studio</h1><small>TP01 / TP02 — Mobile preview</small></header><nav class="tabs"><button id="b1" class="active" onclick="show(1)">TP01 · ทรพา</button><button id="b2" onclick="show(2)">TP02 · นนทกาล</button></nav><main class="screen" id="screen" aria-live="polite"></main><p class="note">หน้าเว็บสำหรับจัดเตรียมการย้ายงาน — ยังไม่ใช่แอนิเมชันฉบับสมบูรณ์ และยังไม่มีไฟล์ภาพเดิมอยู่บน GitHub</p><script>function show(n){document.querySelectorAll('button').forEach((b,i)=>b.classList.toggle('active',i===n-1));document.getElementById('screen').innerHTML=n===1?'<div><strong>TP01 · ทรพา</strong><p>รอนำเข้า HTML และภาพต้นฉบับที่อนุมัติแล้ว<br>จะไม่สร้างตัวละครขึ้นใหม่</p></div>':'<div><strong>TP02 · นนทกาล</strong><p>รอนำเข้าไฟล์ฉากและ Puppet PNG<br>เพื่อปรับรอยต่อและจุดหมุนจากภาพต้นแบบ</p></div>';history.replaceState(null,'','#TP0'+n)}show(location.hash==='#TP02'?2:1)</script></body></html>
