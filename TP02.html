]);document.getElementById('status').textContent=missing.length?'รอไฟล์ภาพต้นฉบับบน GitHub: '+missing.join(', '):'พบไฟล์ภาพแล้ว · พร้อมตรวจการจัดตำแหน่ง';}).catch(()=>document.getElementById('status').textContent='ยังตรวจไฟล์ภาพต้นฉบับไม่ได้');</script></body></html>
