const stage=document.getElementById('stage'),rotate=document.getElementById('rotate'),chosen=document.getElementById('chosen');const pieces=[...document.querySelectorAll('.part')];const initial=Object.fromEntries(pieces.map(p=>[p.id,{left:p.style.left,top:p.style.top,transform:p.style.transform}]));let selected=null,drag=null;function select(p){pieces.forEach(x=>x.classList.toggle('selected',x===p));selected=p;chosen.textContent=p.id;rotate.value=parseFloat((p.style.transform.match(/-?[\d.]+/)||['0'])[0])}pieces.forEach(p=>{p.addEventListener('pointerdown',e=>{select(p);p.setPointerCapture(e.pointerId);drag={x:e.clientX,y:e.clientY,left:parseFloat(p.style.left),top:parseFloat(p.style.top)};e.preventDefault()});p.addEventListener('pointermove',e=>{if(!drag||selected!==p)return;const r=stage.getBoundingClientRect();p.style.left=drag.left+(e.clientX-drag.x)/r.width*100+'%';p.style.top=drag.top+(e.clientY-drag.y)/r.height*100+'%'});p.addEventListener('pointerup',()=>drag=null)});rotate.oninput=()=>{if(selected)selected.style.transform='rotate('+rotate.value+'deg)'};function save(){localStorage.setItem('tp02-pose',JSON.stringify(Object.fromEntries(pieces.map(p=>[p.id,{left:p.style.left,top:p.style.top,transform:p.style.transform}]))))}document.getElementById('save').onclick=save;document.getElementById('reset').onclick=()=>{pieces.forEach(p=>Object.assign(p.style,initial[p.id]));localStorage.removeItem('tp02-pose')};document.getElementById('export').onclick=()=>{const payload=JSON.stringify(Object.fromEntries(pieces.map(p=>[p.id,{left:p.style.left,top:p.style.top,transform:p.style.transform}])),null,2);const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([payload],{type:'application/json'}));a.download='TP02-pose.json';a.click();URL.revokeObjectURL(a.href)};try{const saved=JSON.parse(localStorage.getItem('tp02-pose')||'{}');pieces.forEach(p=>{if(saved[p.id])Object.assign(p.style,saved[p.id])})}catch{}

(function(){
const layer=document.getElementById('draftLayer'),img=document.getElementById('draftImage'),file=document.getElementById('draftFile'),opacity=document.getElementById('draftOpacity'),value=document.getElementById('draftOpacityValue'),toggle=document.getElementById('draftToggle'),move=document.getElementById('draftMove'),reset=document.getElementById('draftReset'),status=document.getElementById('draftStatus');
let visible=true,editing=false,drag=null,dx=0,dy=0,scale=1,objectUrl=null;
function refresh(){layer.style.display=img.getAttribute('src')&&visible?'block':'none';layer.classList.toggle('editing',editing);layer.style.opacity=String(Number(opacity.value)/100);img.style.transform='translate('+dx+'px,'+dy+'px) scale('+scale+')';value.textContent=opacity.value+'%';toggle.textContent=visible?'ซ่อนภาพ':'แสดงภาพ';move.textContent='ขยับภาพ: '+(editing?'เปิด':'ปิด')}
file.addEventListener('change',e=>{const f=e.target.files&&e.target.files[0];if(!f)return;if(objectUrl)URL.revokeObjectURL(objectUrl);objectUrl=URL.createObjectURL(f);img.src=objectUrl;visible=true;editing=false;dx=0;dy=0;scale=1;status.textContent='ภาพอ้างอิง: '+f.name;refresh()});
opacity.addEventListener('input',refresh);
toggle.addEventListener('click',()=>{visible=!visible;refresh()});
move.addEventListener('click',()=>{editing=!editing;refresh()});
reset.addEventListener('click',()=>{dx=0;dy=0;scale=1;refresh()});
layer.addEventListener('pointerdown',e=>{if(!editing)return;drag={x:e.clientX,y:e.clientY,dx,dy};layer.setPointerCapture(e.pointerId);e.preventDefault()});
layer.addEventListener('pointermove',e=>{if(!drag)return;dx=drag.dx+e.clientX-drag.x;dy=drag.dy+e.clientY-drag.y;refresh()});
layer.addEventListener('pointerup',()=>drag=null);
layer.addEventListener('pointercancel',()=>drag=null);
refresh();
})();
</script></body></html>
