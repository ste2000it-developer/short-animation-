<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>TP02 · นนทกาล</title><style>*{box-sizing:border-box}body{margin:0;background:#17121d;color:#fff;font:15px system-ui,"Noto Sans Thai",sans-serif}main{max-width:480px;margin:auto;padding:12px}h1{font-size:21px;margin:4px 0}.sub{color:#d4b2c6;font-size:12px;margin:0 0 10px}.stage{width:100%;aspect-ratio:9/16;overflow:hidden;border-radius:12px;background:#632c69}svg{display:block;width:100%;height:100%}.actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}button{padding:11px 13px;border:0;border-radius:9px;background:#f1a35c;color:#291726;font-weight:700}.note{font-size:12px;color:#dbc8d6;line-height:1.7}.joint{fill:#f8d47b;stroke:#3c1536;stroke-width:2;opacity:0}.show .joint{opacity:1}.asset-warning{color:#ffe4b7;font-size:13px}</style></head><body><main><h1>TP02 · นนทกาล</h1><p class="sub">ประกอบหุ่นจาก PNG ต้นฉบับ · ยึดท่ายืนถือกระบองในภาพอ้างอิง</p><div class="stage" id="stage"><svg id="scene" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 864 1536" aria-label="นนทกาลในฉากประตูเมือง"><defs><linearGradient id="sunset" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#69306f"/><stop offset=".42" stop-color="#aa4c80"/><stop offset=".72" stop-color="#f58c50"/><stop offset="1" stop-color="#f7b65b"/></linearGradient><clipPath id="sprite"><rect width="1536" height="1024"/></clipPath></defs><rect width="864" height="1536" fill="url(#sunset)"/><image href="" data-asset="TP02-background.jpg" width="864" height="1536" preserveAspectRatio="xMidYMid slice"/><g id="puppet" transform="translate(0 0)"><!-- The original transparent sprite sheet is shown through per-part cropped image windows. Nothing is redrawn. --><g id="staff" transform="translate(0 0)"><svg x="377" y="500" width="105" height="610" viewBox="0 0 210 1024" overflow="hidden"><image href="" data-asset="TP02-parts.png" width="1536" height="1024" x="0" y="0"/></svg></g><g id="legs"><svg x="474" y="917" width="185" height="205" viewBox="310 530 300 235" overflow="hidden"><image href="" data-asset="TP02-parts.png" width="1536" height="1024"/></svg><svg x="646" y="917" width="185" height="205" viewBox="880 530 300 235" overflow="hidden"><image href="" data-asset="TP02-parts.png" width="1536" height="1024"/></svg></g><g id="torso"><svg x="468" y="606" width="350" height="275" viewBox="535 194 410 260" overflow="hidden"><image href="" data-asset="TP02-parts.png" width="1536" height="1024"/></svg></g><g id="head"><svg x="545" y="475" width="220" height="195" viewBox="415 0 320 210" overflow="hidden"><image href="" data-asset="TP02-parts.png" width="1536" height="1024"/></svg></g></g><g id="pivots"><circle class="joint" cx="655" cy="618" r="11"/><circle class="joint" cx="552" cy="670" r="11"/><circle class="joint" cx="505" cy="750" r="11"/><circle class="joint" cx="470" cy="810" r="11"/><circle class="joint" cx="770" cy="680" r="11"/><circle class="joint" cx="805" cy="765" r="11"/><circle class="joint" cx="755" cy="830" r="11"/><circle class="joint" cx="640" cy="870" r="11"/><circle class="joint" cx="545" cy="925" r="11"/><circle class="joint" cx="540" cy="1020" r="11"/><circle class="joint" cx="540" cy="1110" r="11"/><circle class="joint" cx="735" cy="925" r="11"/><circle class="joint" cx="740" cy="1020" r="11"/><circle class="joint" cx="740" cy="1110" r="11"/><circle class="joint" cx="655" cy="750" r="11"/></g></svg></div><div class="actions"><label style="background:#f1a35c;color:#291726;border-radius:9px;padding:11px 13px;font-weight:700;cursor:pointer">เลือกภาพฉาก<input id="bgInput" type="file" accept="image/*" hidden></label><label style="background:#f1a35c;color:#291726;border-radius:9px;padding:11px 13px;font-weight:700;cursor:pointer">เลือก PNG ชิ้นส่วน<input id="partsInput" type="file" accept="image/png" hidden></label></div><div class="actions"><button onclick="document.getElementById('scene').classList.toggle('show')">แสดง / ซ่อน Pivot</button><button onclick="location.href='./#TP02'">กลับ Studio</button></div><p class="asset-warning" id="status">กำลังตรวจไฟล์ภาพประกอบ…</p><p class="note">ฉากนี้ใช้ไฟล์ภาพต้นฉบับแยกชิ้น ไม่ใช่ภาพนิ่งทั้งตัว ตำแหน่งประกอบเป็นการวางรอบแรกและต้องตรวจรอยต่ออีกครั้งหลังไฟล์ภาพอยู่บน GitHub</p></main><script>
const dbOpen=new Promise((resolve,reject)=>{const req=indexedDB.open('tp02-assets',1);req.onupgradeneeded=()=>req.result.createObjectStore('images');req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)});
async function storeAsset(key,file){const db=await dbOpen;await new Promise((resolve,reject)=>{const tx=db.transaction('images','readwrite');tx.objectStore('images').put(file,key);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)});}
async function loadAsset(key){const db=await dbOpen;return new Promise(resolve=>{const req=db.transaction('images').objectStore('images').get(key);req.onsuccess=()=>resolve(req.result);req.onerror=()=>resolve(null)})}
async function setAsset(key,file){await storeAsset(key,file);renderAssets()}
document.getElementById('bgInput').onchange=e=>{if(e.target.files[0])setAsset('TP02-background.jpg',e.target.files[0])};
document.getElementById('partsInput').onchange=e=>{if(e.target.files[0])setAsset('TP02-parts.png',e.target.files[0])};
async function renderAssets(){
const names=['TP02-background.jpg','TP02-parts.png'];const local=await Promise.all(names.map(loadAsset));const found=await Promise.all(names.map(async(n,i)=>{if(local[i])return URL.createObjectURL(local[i]);try{const r=await fetch('./'+n,{method:'HEAD',cache:'no-store'});return r.ok&&(r.headers.get('content-type')||'').startsWith('image/')?'./'+n:null}catch{return null}}));
document.querySelectorAll('[data-asset]').forEach(el=>{const i=names.indexOf(el.dataset.asset);if(found[i])el.setAttribute('href',found[i]);else el.removeAttribute('href')});
const missing=names.filter((_,i)=>!found[i]);const stage=document.getElementById('stage');let notice=document.getElementById('missingNotice');if(notice)notice.remove();
document.getElementById('puppet').style.display=found[1]?'':'none';
if(missing.length){stage.style.position='relative';stage.insertAdjacentHTML('beforeend','<div id="missingNotice" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:28px;color:white;background:linear-gradient(#65336f,#c65a80 55%,#f8ad5d)"><div><strong style="font-size:23px">TP02 · นนทกาล</strong><p style="line-height:1.7">เลือกไฟล์ภาพต้นฉบับด้วยปุ่มด้านล่าง<br>ระบบจะจำภาพไว้ในเบราว์เซอร์เครื่องนี้</p></div></div>');}
document.getElementById('status').textContent=missing.length?'ยังขาด: '+missing.join(', '):'โหลดภาพครบแล้ว · พร้อมตรวจรอยต่อ';
}
renderAssets();
</script></body></html>
